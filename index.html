var W1 = {"w":1,"title":"教會是基督的身體","key":"林前12:27","theme":"我不是坐在教會裡的觀眾，我是基督身上不可少的肢體。","group":["讀林前12:12-27，哪一句話最觸動你？為甚麼？","你曾經覺得自己在教會「可有可無」嗎？神的話怎樣改變這個看法？","這週你願意主動關心小組裡哪一位肢體？說出具體要做的一件事。"],"sunday":"這個主日，進會堂前先停一下，對主說：「我不是來看聚會的，我是來與你的身體一同敬拜的。」聚會中留意一位你平常沒有注意的人；聚會後主動問候他，並記下他的名字為他禱告。","lessons":[{"d":1,"step":"資訊・啟示","title":"一個身子，許多肢體","ref":"林前12:12-20","hear":"很多人一提到教會，腦海裡浮現的是一棟建築、一個主日聚會、一份週報。但保羅給教會畫的第一幅像，不是房子，而是身體：「就如身子是一個，卻有許多肢體；而且肢體雖多，仍是一個身子；基督也是這樣。」（林前12:12）\n\n請留意最後一句——「基督也是這樣」。保羅沒有說「教會也是這樣」，而是說「基督」。教會與基督聯合得如此緊密，以致保羅直接用基督的名字稱呼這個身體。當年掃羅逼迫信徒，復活的主在大馬士革路上問他：「掃羅！掃羅！你為甚麼逼迫我？」（徒9:4）逼迫教會，就是逼迫基督自己。\n\n身體有三個特徵。第一，它是活的，不是組裝的；肢體不是後來黏上去的零件，而是從同一個生命長出來的。第二，它是合一的，卻不是單一的；眼、耳、手、腳各不相同，卻屬於同一個身子。第三，它有一個頭，生命、方向和命令都從頭而來。\n\n所以，你成為基督徒的那一天，不只是「得救了」，也是被放進了一個身體。你可能還沒有找到自己的位置，但你已經是肢體了。今天，求聖靈打開你的眼睛，不再用「去教會」的眼光看教會，而用「我在身體裡」的眼光看自己。","light":"有己的人看教會，問的是「這間教會適不適合我」；無己的人看教會，問的是「主把我放在這身體裡，要我怎樣配搭」。改變從觀念開始：當我從人的觀點轉到神的觀點，我就不再是挑選商品的顧客，而是主所安排的肢體。","think":["林前12:12-20裡，保羅用了哪些身體部位作比喻？","我平常說「去教會」時，心裡想的是甚麼畫面？","如果教會是基督的身體，我這週可以怎樣活出肢體的身分？"],"speak":"主耶穌，謝謝祢把我放在祢的身體裡。赦免我常把教會當成一個場所、一個節目，甚至一個可以挑剔的地方。求聖靈開我的眼睛，讓我看見自己是祢身上的肢體，也看見身旁的弟兄姊妹是我的同肢體。奉主耶穌的名禱告，阿們。","do":"今天寫下三位你教會（或小組）中的弟兄姊妹的名字，在每個名字旁寫一句：「他是基督的身體，我與他同屬一身。」然後為他們各禱告一句。","quick":"教會不是我去的地方，是我所屬的身體。","rl":"哥林多前書 12:12-20","text":[[12,12,"就如身子是一個，卻有許多肢體；而且肢體雖多，仍是一個身子；基督也是這樣。"],[12,13,"我們不拘是猶太人，是希臘人，是為奴的，是自主的，都從一位聖靈受洗，成了一個身體，飲於一位聖靈。"],[12,14,"身子原不是一個肢體，乃是許多肢體。"],[12,15,"設若腳說：「我不是手，所以不屬乎身子，」它不能因此就不屬乎身子。"],[12,16,"設若耳說：「我不是眼，所以不屬乎身子，」它也不能因此就不屬乎身子。"],[12,17,"若全身是眼，從哪裏聽聲呢？若全身是耳，從哪裏聞味呢？"],[12,18,"但如今，神隨自己的意思把肢體俱各安排在身上了。"],[12,19,"若都是一個肢體，身子在哪裏呢？"],[12,20,"但如今肢體是多的，身子卻是一個。"]]},{"d":2,"step":"信服","title":"我用不著你？","ref":"林前12:21-27","hear":"一位在教會十多年的弟兄這樣說：「我只要主日來聽道就好，小組太花時間，服事讓別人去做。」他不是壞人，他只是把教會當作加油站——累了來加點油，加滿就走。直到有一天他住院開刀，躺在病床上三個星期，沒有一個人知道。出院後他第一次哭著對牧師說：「原來我一直不屬於任何人。」\n\n保羅說：「眼不能對手說：『我用不著你。』頭也不能對腳說：『我用不著你。』」（林前12:21）在哥林多教會，有人覺得自己恩賜大、地位高，用不著別人；也有人覺得自己不起眼，「我不是手，所以不屬乎身子」。這兩種想法看起來相反，其實同出一源：都是以自己為中心來衡量自己與身體的關係。\n\n神的觀點完全不同：「身上肢體人以為軟弱的，更是不可少的。」（林前12:22）在神的設計裡，沒有一個肢體是多餘的，也沒有一個肢體可以獨立存活。被切下來的手指，不論多麼靈巧，都會壞死。\n\n請誠實地問自己：我是那個說「我用不著你」的眼嗎？還是那個說「我不屬乎身子」的腳？兩者都需要悔改，回到神為我安排的位置上。","light":"驕傲說：「我用不著你」；自卑說：「你用不著我」。兩者都是離開了本位。謙卑不是把自己看得很低，而是照神的眼光看自己：我需要你，你也需要我。這就是無己的生命——不以自己為中心，而以基督的身體為念。","think":["林前12:21-27中，神怎樣對待「軟弱」和「不體面」的肢體？","我比較像說「我用不著你」的眼，還是說「我不屬乎身子」的腳？","有哪一位肢體是我曾經忽略、覺得「用不著」的？"],"speak":"天父，我承認我常常以為自己可以獨立過信仰生活，不需要別人，也不想被別人需要。求祢破碎我裡面的驕傲與自卑，使我看見祢為我安排的位置，也看重每一個肢體。奉主耶穌的名禱告，阿們。","do":"想一位你過去較少理會的弟兄或姊妹，今天傳一則訊息給他：「最近好嗎？我為你禱告了。」不需要長，只要真誠。","quick":"沒有一個肢體是多餘的，包括我，也包括你。","rl":"哥林多前書 12:21-27","text":[[12,21,"眼不能對手說：「我用不著你。」頭也不能對腳說：「我用不著你。」"],[12,22,"不但如此，身上肢體人以為軟弱的，更是不可少的。"],[12,23,"身上肢體，我們看為不體面的，越發給它加上體面；不俊美的，越發得著俊美。"],[12,24,"我們俊美的肢體，自然用不著裝飾；但神配搭這身子，把加倍的體面給那有缺欠的肢體，"],[12,25,"免得身上分門別類，總要肢體彼此相顧。"],[12,26,"若一個肢體受苦，所有的肢體就一同受苦；若一個肢體得榮耀，所有的肢體就一同快樂。"],[12,27,"你們就是基督的身子，並且各自作肢體。"]]},{"d":3,"step":"實踐","title":"彼此相顧的身體","ref":"林前12:24-26","hear":"人的身體有一個奇妙的設計：當你的腳趾踢到桌腳，整個人會立刻彎下腰，手去按著腳，眼睛去看傷口，嘴巴會「唉喲」一聲。沒有人開會決定要不要幫腳趾，全身就自然地一起行動。保羅說，教會也該是這樣：「免得身上分門別類，總要肢體彼此相顧。若一個肢體受苦，所有的肢體就一同受苦；若一個肢體得榮耀，所有的肢體就一同快樂。」（林前12:25-26）\n\n「彼此相顧」不是少數熱心同工的工作，而是每一個肢體的本能。它常常很平凡：記得一位姊妹這週要面試，傳一句禱告給她；發現一位老人家聚會後總是一個人吃飯，邀他同桌；知道一個家庭剛搬家，帶一餐飯過去。\n\n今天的功課很簡單：找一位正在受苦或正有喜事的肢體，與他「一同」。與哀哭的人同哭，不是給他一堆道理；與喜樂的人同樂，不是暗暗比較。保羅在羅馬書也這樣吩咐：「與喜樂的人要同樂；與哀哭的人要同哭。」（羅12:15）\n\n當你這樣做，你就在實踐一個真理：我不是自己一個人信主，我是活在一個身體裡。","light":"人比事重要，關係比東西重要。身體的健康不在於活動辦得多熱鬧，而在於肢體之間有沒有「一同」。讓耶穌作王的教會，會自然長出彼此相顧的生命；這是聖靈的果子，不是規定出來的制度。","think":["林前12:25-26提到哪兩種「一同」？","最近有沒有肢體受苦或得榮耀，而我沒有「一同」？","今天我可以用甚麼具體方式與他「一同」？"],"speak":"主啊，求祢給我一顆會感覺的心。讓我不再麻木地坐在聚會中，而能察覺身旁肢體的痛苦與喜樂。今天帶領我去關心祢要我關心的那一位，並且用祢的愛去愛他。奉主耶穌的名禱告，阿們。","do":"今天選定一位正在經歷困難或喜事的肢體，打一通電話、送一份小點心或親自探訪，並當面或在電話中為他禱告。","quick":"一個肢體受苦，全身一同受苦；我願意「一同」。","rl":"哥林多前書 12:24-26","text":[[12,24,"我們俊美的肢體，自然用不著裝飾；但神配搭這身子，把加倍的體面給那有缺欠的肢體，"],[12,25,"免得身上分門別類，總要肢體彼此相顧。"],[12,26,"若一個肢體受苦，所有的肢體就一同受苦；若一個肢體得榮耀，所有的肢體就一同快樂。"]]},{"d":4,"step":"檢討・修正","title":"頭在哪裡，身體就往哪裡","ref":"弗1:20-23","hear":"一個身體再強壯，若頭不清楚，就會亂走。保羅說，神使基督「為教會作萬有之首。教會是他的身體，是那充滿萬有者所充滿的。」（弗1:22-23）教會最大的問題，常常不是缺少人才或資源，而是頭的位置被別的東西佔據了。\n\n有時佔據頭位的是一位強勢的領袖，大家看他的臉色做事；有時是一個大家族，誰的人多誰說了算；有時是傳統：「我們一向都是這樣做的」；最隱密的，是我自己——我的喜好、我的面子、我的意見。當一個肢體想要指揮全身，身體就會抽筋。\n\n今天請安靜檢討：在我參與教會生活的方式裡，誰在作頭？當我不滿意講道、不贊成某個決定、不喜歡某一位同工時，我第一個反應是去問主的心意，還是先講出我的感受、找人訴苦？\n\n檢討不是為了定罪，而是為了修正。修正的方法很簡單，就是把頭的位置還給基督。每當你要對教會的事發表意見之前，先問三個問題：這是耶穌要的嗎？這合乎聖經嗎？這是聖靈的感動，還是我的情緒？","light":"有己的生命想作頭，無己的生命甘心作肢體。驕傲就是離開肢體的本位，抓住只屬於元首的權力。讓耶穌作王，在教會裡最具體的意思就是：我的意見要降服在元首的心意之下。","think":["弗1:20-23說基督的地位如何？教會與基督是甚麼關係？","在教會生活中，我在哪些事上想作「頭」？","下一次我對教會有意見時，要先做甚麼？"],"speak":"主耶穌，祢是教會的頭，也是我的頭。我承認我常想讓自己的意見作主，用自己的好惡判斷祢的教會。今天我把頭的位置還給祢，求祢在我心中作王，帶領我的言語和態度。奉主耶穌的名禱告，阿們。","do":"在日誌寫下最近一件你對教會「不滿意」的事，把它帶到主面前，誠實地問：「主啊，祢怎麼看？我該怎樣回應？」寫下你從聖靈領受的一句話。","quick":"把頭的位置還給基督，我就回到肢體的本位。","rl":"以弗所書 1:20-23","text":[[1,20,"就是照他在基督身上所運行的大能大力，使他從死裏復活，叫他在天上坐在自己的右邊，"],[1,21,"遠超過一切執政的、掌權的、有能的、主治的，和一切有名的；不但是今世的，連來世的也都超過了。"],[1,22,"又將萬有服在他的腳下，使他為教會作萬有之首。"],[1,23,"教會是他的身體，是那充滿萬有者所充滿的。"]]},{"d":5,"step":"反覆・繁殖","title":"在愛中建立自己","ref":"弗4:15-16","hear":"這一週，我們從一個簡單的圖畫開始：教會是基督的身體。現在讓我們把它放在心裡反覆咀嚼，並傳給另一個人。\n\n保羅描繪了一個健康身體的樣子：「全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。」（弗4:16）請留意幾個關鍵詞：「靠他」——生命從基督而來；「各按各職」——每個人都有位置；「彼此相助」——沒有人單打獨鬥；「在愛中」——一切的建造都以愛為環境。\n\n想像一個樂團：小提琴不需要羨慕定音鼓，長笛也不必嫌棄低音管。只要每個人看著同一位指揮、照著同一份樂譜，各自的聲音就合成了美妙的和聲。教會的美麗，不是因為每個人都一樣，而是因為不同的人在同一位主的帶領下彼此配搭。\n\n繁殖的意思，是把你這週領受的真理說給一個人聽。不需要講道，只要分享一句：「這週我發現，我不是去教會，我就是教會的一部分。」當一個人開始這樣看自己，教會就多了一個醒過來的肢體。","light":"改變觀念的八大步驟，最後一步是繁殖。真理若只停在我身上，就像身體裡堵住的血管；流出去，才有生命。920的操練從身邊的「2」開始：今天把這份領受傳給一位與你有關係的人。","think":["弗4:16中，身體增長需要哪些條件？","這一週，我對「教會」的看法有甚麼改變？","我要把這週的領受分享給誰？甚麼時候？"],"speak":"天父，謝謝祢這一週向我顯明，我是基督身上的肢體。求祢使這個真理在我心裡生根，也藉著我傳給別人。願我們的教會在愛中被建立，各按各職、彼此相助，叫基督得著榮耀。奉主耶穌的名禱告，阿們。","do":"今天找你的屬靈同伴或一位小組員，花五分鐘分享這週最觸動你的一句經文，並邀請他也說說他的看法，最後彼此代禱。","quick":"各按各職、彼此相助，在愛中一同被建立。","rl":"以弗所書 4:15-16","text":[[4,15,"惟用愛心說誠實話，凡事長進，連於元首基督，"],[4,16,"全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。"]]}],"kl":"哥林多前書 12:27","keyText":"你們就是基督的身子，並且各自作肢體。"};
